# Config tmux recomendada para un host de RemoteMarvin (variante "SSH directo al host").
# La instala setup-host.sh en ~/.tmux.conf (no pisa uno existente).

set -g default-terminal "xterm-256color"
set -g destroy-unattached off
set -g mouse on

# La app marca sus sesiones con MARVIN_DISPLAY (la pasa el cliente tmux). Propagarla a los
# paneles nuevos: el ~/.ssh/config la usa para tunelizar el display a los servers que SSH-ees
# DESDE la app (headed-browser remoto). Un tmux abierto a mano (sin la var) la quita.
set -ga update-environment MARVIN_DISPLAY
# EDITOR también, para que el Ctrl+G de Claude Code (abrir el plan en el editor) encuentre
# el editor al REENGANCHARSE a una sesión persistente, no sólo en las creadas frescas (la app
# lo exporta en `tmux new`, pero sin esto tmux no lo propaga al attach ni a paneles nuevos).
set -ga update-environment EDITOR

# Arrancar el render/docs daemon SÓLO cuando la app se conecta (sesión con MARVIN_DISPLAY).
# Es el que recibe HTML/URLs y documentos de los servers que SSH-ees desde la app (por el
# reverse tunnel :6090). No hace falta tenerlo prendido siempre: con este hook existe desde
# que abrís la app. 'start' es idempotente (si ya corre, no hace nada).
set-hook -g client-attached 'run-shell -b "tmux show-environment MARVIN_DISPLAY >/dev/null 2>&1 && XDG_RUNTIME_DIR=/run/user/$(id -u) systemctl --user start marvin-render.service 2>/dev/null || true"'

# Copiar al portapapeles del CELULAR vía OSC 52 (la terminal de la app lo captura).
# Con el botón "Sel" de la app, arrastrás con el dedo -> selección NATIVA de tmux (que
# scrollea sola) y al soltar queda en el portapapeles del celu.
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# Las flechas SIEMPRE controlan la app (salen del copy-mode/scroll y mandan la flecha),
# útil para menús de claude. El scroll/selección queda para el dedo.
bind -T copy-mode    Up    send -X cancel \; send-keys Up
bind -T copy-mode    Down  send -X cancel \; send-keys Down
bind -T copy-mode    Left  send -X cancel \; send-keys Left
bind -T copy-mode    Right send -X cancel \; send-keys Right
bind -T copy-mode-vi Up    send -X cancel \; send-keys Up
bind -T copy-mode-vi Down  send -X cancel \; send-keys Down
bind -T copy-mode-vi Left  send -X cancel \; send-keys Left
bind -T copy-mode-vi Right send -X cancel \; send-keys Right
