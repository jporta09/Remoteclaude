name: CI

# Rápido y sin dispositivo: lo que puede correr en cada push sin pelear con un emulador.
# La suite E2E instrumentada NO va acá (ver test/e2e/README.md): el APK es arm64-only y
# bajo traducción en un runner virtualizado tarda ~30 min y es intermitente. Corre local
# con `make e2e`, y más adelante como job nocturno o en un runner self-hosted.
#
# Dónde corre: la variable de repo MARVIN_RUNNER. Sin definir, los runners de GitHub; con
# `self-hosted`, el runner de esta PC (scripts/setup-runner.sh). Es una variable y no un
# valor fijo acá para poder cambiar de lado desde la web, sin un commit — que es lo que
# hizo falta cuando el CI hospedado dejó de arrancar por facturación y los 8 pushes
# siguientes se quedaron sin ninguna verificación.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  android:
    name: App (unit + lint + build)
    runs-on: ${{ vars.MARVIN_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      # AGP busca el SDK primero en local.properties y recién después en ANDROID_HOME. Se
      # escribe el archivo aunque la variable esté puesta, porque el daemon de Gradle es un
      # proceso de larga vida: si el build reusa uno arrancado antes —cosa habitual en un
      # runner self-hosted, donde el daemon lo puede haber levantado una compilación local
      # de la misma máquina— entonces System.getenv("ANDROID_HOME") adentro del daemon
      # devuelve null y el build muere con "SDK location not found" con la variable puesta
      # en el job. Por el archivo no hay ambigüedad. local.properties está gitignoreado, así
      # que en el checkout del runner no existe.
      - name: Ubicar el SDK de Android
        env:
          # En los runners de GitHub el SDK viene preinstalado con ANDROID_HOME puesto. En
          # el self-hosted no alcanza con ponérselo al servicio: está medido que el entorno
          # del proceso del runner NO llega a los steps. La ruta viaja entonces por una
          # variable de repo, que sí llega — y así el workflow no tiene rutas de ninguna
          # máquina adentro. La define scripts/setup-runner.sh al instalar.
          SDK_DEL_RUNNER: ${{ vars.MARVIN_ANDROID_SDK }}
        run: |
          SDK="${SDK_DEL_RUNNER:-$ANDROID_HOME}"
          test -n "$SDK" || {
            echo "::error::no sé dónde está el SDK de Android: ni ANDROID_HOME ni la variable de repo MARVIN_ANDROID_SDK"
            exit 1
          }
          echo "sdk.dir=$SDK" > android/local.properties
      - name: Tests unitarios
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Lint de Android
        working-directory: android
        run: ./gradlew :app:lintDebug
      - name: Build debug
        working-directory: android
        run: ./gradlew :app:assembleDebug
      # Build de release: corre R8 y, con él, verifyReleaseKeepRules, que verifica sobre
      # mapping.txt que se conserve lo que se busca por nombre en runtime (el binding de
      # gomobile, trilead). Sin esto, romper una regla keep no se nota hasta que la app
      # arranca en un teléfono. Sin keystore.properties el APK sale sin firmar, que para
      # verificar alcanza.
      - name: Build release + reglas de R8
        working-directory: android
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reportes-android
          path: |
            android/app/build/reports/
            android/app/build/test-results/

  host:
    name: Scripts y daemons del host
    runs-on: ${{ vars.MARVIN_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: shellcheck
        run: |
          uv run --with shellcheck-py shellcheck --severity=warning \
            scripts/*.sh scripts/marvin-stt scripts/marvin-display-allowed \
            scripts/marvin-allow-display \
            plugins/remotemarvin/scripts/*.sh \
            plugins/remotemarvin/skills/*/scripts/*.sh
      - name: ruff (daemons del host)
        run: uv run --with ruff ruff check scripts/*.py test/host/*.py test/e2e/fixture/*.py
      - name: Tests de los daemons
        run: uv run --with pytest --with websocket-client --with pycryptodome pytest test/host/ -q

  go-bridge:
    name: Bridge de Tailscale (Go)
    runs-on: ${{ vars.MARVIN_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tailscale-bridge/go.mod
      - name: Formato
        working-directory: tailscale-bridge
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - name: go vet
        working-directory: tailscale-bridge
        run: go vet ./...
      - name: Tests (con detector de carreras)
        working-directory: tailscale-bridge
        run: go test -race ./...
      - name: AAR al día con el source Go (DEVOPS-2)
        working-directory: tailscale-bridge
        run: |
          # El .sha256 del AAR es del binario (gomobile no reconstruye byte-a-byte) y sólo
          # detecta corrupción. Este chequeo compara el HASH DEL SOURCE Go con el que grabó
          # build-aar.sh: si alguien editó el bridge y olvidó reconstruir el AAR, falla acá
          # en vez de shipear un bridge viejo en silencio. No necesita gomobile/NDK.
          esperado=$(cat ../android/app/libs/marvints.aar.srchash 2>/dev/null || echo MISSING)
          actual=$({ for f in *.go; do case "$f" in *_test.go) ;; *) sha256sum "$f" ;; esac; done; sha256sum go.mod go.sum 2>/dev/null; } | sort | sha256sum | awk '{print $1}')
          if [ "$esperado" != "$actual" ]; then
            echo "::error::El AAR (android/app/libs/marvints.aar) está DESACTUALIZADO respecto del source Go."
            echo "El bridge cambió sin reconstruir el AAR. Corré: (cd tailscale-bridge && ./build-aar.sh) y commiteá .aar + .sha256 + .srchash."
            echo "esperado=$esperado  actual=$actual"
            exit 1
          fi
          echo "AAR al día con el source Go ✓ ($actual)"
