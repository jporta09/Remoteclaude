name: E2E

# La suite instrumentada (29 tests) contra el fixture desechable y un AVD. Va en un workflow
# aparte de ci.yml porque es de otro orden de magnitud: minutos en vez de segundos, y no
# corre en cualquier máquina — necesita KVM, Docker y el AVD `marvin-e2e`. En los runners de
# GitHub el APK arm64 bajo traducción tardaba ~30 min y era intermitente; por eso durante
# mucho tiempo esto sólo existió como `make e2e` local.
#
# Reemplaza al "E2E (nocturno)" que vivía acá: corría en ubuntu-latest con swiftshader y
# `continue-on-error: true`, así que la corrida figuraba **verde con el job en rojo** — la
# última programada (2026-08-10) falló y en la lista aparece success. Un canario que sólo
# dice "sí" no es un canario.
on:
  pull_request:
  # También en push a main: trabajo que entra por push DIRECTO (sin PR) —como entró la política A
  # de OSC 52 (v1.20.0)— no gatillaba el e2e, así que un control de seguridad podía mergear sin que
  # su test corriera nunca. Ahora corre en cada push a main (sigue gateado por MARVIN_RUNNER).
  push:
    branches: [main]
  # Para poder correrla a mano sin abrir un PR (y para verificar el job la primera vez).
  workflow_dispatch:
  # El canario semanal sí se conserva, y ahora sobre el runner de verdad: sin PRs de por
  # medio nadie se enteraría de que la máquina cambió abajo (SDK, AVD, docker, la ACL de
  # KVM). Sin continue-on-error: si falla, se ve rojo.
  schedule:
    - cron: "0 5 * * 1"   # lunes 05:00 UTC

# El AVD y los puertos del fixture son recursos ÚNICOS de la máquina: dos corridas
# simultáneas se pisan. Y ante dos pushes seguidos interesa el último.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Suite instrumentada (emulador + fixture)
    # Sin runner propio no tiene sentido intentarlo: los runners de GitHub no dan KVM ni
    # tienen el AVD. Si la variable no está, el job se saltea en vez de fallar en rojo.
    if: vars.MARVIN_RUNNER != ''
    runs-on: ${{ vars.MARVIN_RUNNER }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Ubicar el SDK de Android
        env:
          SDK_DEL_RUNNER: ${{ vars.MARVIN_ANDROID_SDK }}
        run: |
          SDK="${SDK_DEL_RUNNER:-$ANDROID_HOME}"
          test -n "$SDK" || {
            echo "::error::no sé dónde está el SDK de Android (ni ANDROID_HOME ni MARVIN_ANDROID_SDK)"
            exit 1
          }
          echo "sdk.dir=$SDK" > android/local.properties
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # `adb` no está en el PATH del servicio; e2e.sh respeta $ADB.
          echo "ADB=$SDK/platform-tools/adb" >> "$GITHUB_ENV"

      # Se chequea explícito porque el modo de fallar sin KVM es pésimo: el emulador no
      # muere, arranca en emulación por software y la suite se va a timeout 45 minutos
      # después, con el síntoma lejísimos de la causa.
      #
      # OJO: el permiso sobre /dev/kvm en esta máquina viene de una ACL de logind
      # (`user:jporta:rw-`), no del grupo kvm, y esas ACL se otorgan a la SESIÓN ACTIVA. Con
      # el runner corriendo como servicio con linger, cerrar sesión gráfica se la lleva.
      # La solución durable es estar en el grupo `kvm` (scripts/setup-runner.sh lo detecta
      # y lo ofrece), y toma efecto recién al reiniciar la máquina: el gestor de servicios
      # de usuario fija sus grupos al nacer y, con linger, nace con el boot.
      - name: Verificar KVM
        run: |
          test -r /dev/kvm && test -w /dev/kvm || {
            echo "::error::sin acceso a /dev/kvm — el emulador iría por software y la suite se colgaría"
            ls -l /dev/kvm || true
            getfacl /dev/kvm 2>/dev/null || true
            exit 1
          }

      # El modo de render lo elige e2e.sh según haya o no sesión gráfica — acá no hay, el
      # runner arranca con el boot. Vive ahí y no en este workflow a propósito: así el
      # mismo `make e2e` anda en los dos lados sin que quien lo corre tenga que saberlo.
      # (Fijarlo acá dejaba la corrida local igual de rota cuando se la lanza sin DISPLAY,
      # que es como pasó de verdad.)
      - name: Suite
        run: make e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reportes-e2e
          path: |
            android/app/build/reports/androidTests/connected/
            /tmp/e2e-emulator.log

      # El runner es una máquina de verdad y el estado sobrevive al job: si la corrida se
      # cancela (cancel-in-progress), el trap de limpieza de e2e.sh no llega a correr y
      # quedarían el emulador y el fixture arriba, pisando la corrida siguiente.
      - name: Limpieza
        if: always()
        run: |
          docker compose -f test/e2e/docker-compose.e2e.yml down -v --remove-orphans || true
          "${ADB:-adb}" -s emulator-5556 emu kill || true

  caja-negra:
    name: Release en caja negra (APK publicado)
    # Sí bloquea PRs, después de diagnosticar la intermitencia que tenía. No era del
    # producto ni del emulador: era CONTENCIÓN DE CPU. Se reprodujo a pedido saturando 10
    # de 12 núcleos —11 corridas verdes con la máquina tranquila, roja en la primera con
    # carga— y ahí el mensaje fue claro: `kexTimeout (8000 ms) expired`, o sea el canal de
    # control del propio test al fixture. Con los plazos del andamio ajustados, 3 de 3 en
    # verde bajo esa misma carga.
    #
    # NO en `push` a main: ahí alcanza con el suite de :app (que incluye los tests de seguridad como
    # ClipboardE2ETest y es robusto vía MarvinTestRunner). La caja negra —UiAutomator sobre el APK
    # publicado, más sensible a la carga— sigue bloqueando PRs y corriendo en el canario, que es donde
    # el mantenedor la puso; correrla en cada push agregaba flakiness (StaleObjectException) sin cubrir
    # nada que el suite de :app no cubra ya.
    if: vars.MARVIN_RUNNER != '' && github.event_name != 'push'
    runs-on: ${{ vars.MARVIN_RUNNER }}
    timeout-minutes: 45
    # Comparte AVD y puertos del fixture con el job de arriba: tienen que ir en serie.
    needs: [e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ubicar el SDK de Android
        env:
          SDK_DEL_RUNNER: ${{ vars.MARVIN_ANDROID_SDK }}
        run: |
          SDK="${SDK_DEL_RUNNER:-$ANDROID_HOME}"
          test -n "$SDK" || { echo "::error::no sé dónde está el SDK de Android"; exit 1; }
          echo "sdk.dir=$SDK" > android/local.properties
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ADB=$SDK/platform-tools/adb" >> "$GITHUB_ENV"
      - name: Suite de caja negra
        run: make e2e-caja-negra
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reportes-caja-negra
          path: |
            android/blackbox/build/reports/androidTests/connected/
            /tmp/e2e-emulator.log
      - name: Limpieza
        if: always()
        run: |
          docker compose -f test/e2e/docker-compose.e2e.yml down -v --remove-orphans || true
          "${ADB:-adb}" -s emulator-5556 emu kill || true
