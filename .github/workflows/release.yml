name: Release

# Publica el APK firmado en un GitHub Release cuando se empuja un tag vX.Y.Z.
#
# Flujo para sacar una versión:
#   1) bumpear versionCode/versionName en android/app/build.gradle.kts
#   2) commit + push a main
#   3) git tag v1.12.0 && git push origin v1.12.0
# El tag DEBE coincidir con versionName (el job lo verifica y aborta si no).
#
# Firma: el keystore de release NO está en el repo (keystore.properties está gitignoreado).
# Se reconstruye en el runner desde secrets (ver abajo). Si faltan, el build sale sin firmar
# y el job aborta a propósito, para no publicar un APK que no instala como actualización.
#
# Secrets del repo que hacen falta (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64  -> base64 del .jks     (base64 -w0 release.jks)
#   RELEASE_STORE_PASSWORD   -> storePassword
#   RELEASE_KEY_ALIAS        -> keyAlias
#   RELEASE_KEY_PASSWORD     -> keyPassword
# IMPORTANTE: usar SIEMPRE el mismo keystore que las versiones anteriores; Android no deja
# actualizar entre firmantes distintos.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build firmado + publicar
    runs-on: ${{ vars.MARVIN_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write   # crear el Release y subir el APK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      # Igual que en ci.yml: AGP busca el SDK en local.properties primero.
      - name: Ubicar el SDK de Android
        env:
          SDK_DEL_RUNNER: ${{ vars.MARVIN_ANDROID_SDK }}
        run: |
          SDK="${SDK_DEL_RUNNER:-$ANDROID_HOME}"
          test -n "$SDK" || {
            echo "::error::no sé dónde está el SDK de Android: ni ANDROID_HOME ni la variable de repo MARVIN_ANDROID_SDK"
            exit 1
          }
          echo "sdk.dir=$SDK" > android/local.properties

      - name: El tag coincide con versionName
        run: |
          VN=$(grep -oE 'versionName = "[^"]+"' android/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          echo "versionName=$VN  tag=$TAG"
          test "$VN" = "$TAG" || {
            echo "::error::el tag ($GITHUB_REF_NAME) no coincide con versionName ($VN) en build.gradle.kts"
            exit 1
          }

      # Guard de monotonía: si el versionCode de este tag no es MAYOR al del último release,
      # Android/Obtainium rechazan el APK como update en SILENCIO (falla que no se ve hasta que
      # el usuario no puede actualizar). Se lee el versionCode del último release desde su body
      # (donde lo sembramos, ver el step "Publicar"). REST API vía curl para no depender de que
      # el runner (self-hosted) tenga `gh`/`jq` instalados; el body trae la línea `versionCode: N`
      # literal, así que un grep sobre el JSON crudo alcanza.
      #
      # FAIL-CLOSED: se distingue el error de red/HTTP del bootstrap genuino. Antes `curl -sf ... || true`
      # colapsaba ambos en PREV_VC vacío → un 5xx/rate-limit transitorio SALTEABA el guard (la falla que
      # existe para prevenir). Ahora un error HTTP tras reintentos ABORTA; sólo se saltea el bootstrap real
      # (404 = no hay releases; o 200 sin el marcador = release previo a este guard).
      - name: versionCode monotónico
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VC=$(grep -oE 'versionCode = [0-9]+' android/app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          test -n "$VC" || { echo "::error::no pude leer versionCode de build.gradle.kts"; exit 1; }
          echo "vc=$VC" >> "$GITHUB_OUTPUT"

          CODE=000
          for intento in 1 2 3; do
            CODE=$(curl -s -o /tmp/rel.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/latest" || echo 000)
            case "$CODE" in
              200|404) break ;;
              *) echo "::warning::intento $intento: HTTP $CODE al leer el último release, reintento"; sleep 5 ;;
            esac
          done

          if [ "$CODE" = "404" ]; then
            echo "::warning::no hay releases previos (bootstrap): salteo la comparación monotónica"
          elif [ "$CODE" = "200" ]; then
            PREV_VC=$(grep -oE 'versionCode: [0-9]+' /tmp/rel.json | head -1 | grep -oE '[0-9]+' || true)
            if [ -z "$PREV_VC" ]; then
              echo "::warning::el último release no expone versionCode (previo al guard): salteo la comparación"
            else
              echo "versionCode actual=$VC  previo=$PREV_VC"
              test "$VC" -gt "$PREV_VC" || {
                echo "::error::versionCode $VC no es mayor al del último release ($PREV_VC): Android/Obtainium rechazan el update"
                exit 1
              }
            fi
          else
            echo "::error::no pude leer el último release (HTTP $CODE) tras 3 reintentos: aborto en vez de publicar a ciegas un update que Android/Obtainium podrían rechazar en silencio"
            exit 1
          fi

      - name: Reconstruir el keystore desde secrets
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KS_KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KS_B64" || { echo "::error::falta el secret RELEASE_KEYSTORE_BASE64 — sin él el APK saldría sin firmar"; exit 1; }
          echo "$KS_B64" | base64 -d > android/release.jks
          cat > android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${KS_STORE_PW}
          keyAlias=${KS_ALIAS}
          keyPassword=${KS_KEY_PW}
          EOF

      # SEC5-1: el bridge nativo (tsnet + auth key) se construye ACÁ desde el source Go, no se
      # toma del blob committeado (que queda para desarrollo local). Mismo script que valida
      # el job aar-build de ci.yml en cada push.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tailscale-bridge/go.mod
      - name: Construir marvints.aar desde el source (gomobile, arm64)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          [ -n "$ANDROID_NDK_HOME" ] || export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | tail -1)"
          tailscale-bridge/build-aar.sh --arm-only
          (cd android/app/libs && git diff --quiet -- marvints.aar.srchash) || { echo "::error::el srchash del AAR construido difiere del committeado"; exit 1; }
          sha256sum android/app/libs/marvints.aar | tee "marvints-${GITHUB_REF_NAME}.aar.sha256"

      - name: Build release firmado (arm64, R8)
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Preparar APK + checksum
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC" || { echo "::error::no encontré el APK de release en $SRC"; exit 1; }
          OUT="RemoteMarvin-${GITHUB_REF_NAME}.apk"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee "${OUT}.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # El keystore no debe quedar en disco del runner (sobre todo en self-hosted).
      - name: Borrar el keystore del runner
        if: always()
        run: rm -f android/release.jks android/keystore.properties

      - name: Publicar el GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256
            marvints-${{ github.ref_name }}.aar.sha256
          generate_release_notes: true
          body: |
            **RemoteMarvin ${{ github.ref_name }}** — APK firmado para Android.

            - **Arquitectura:** arm64-v8a (teléfonos; no corre en x86).
            - **SHA-256:** `${{ steps.apk.outputs.sha }}`

            ### Instalar
            1. Bajá `${{ steps.apk.outputs.apk }}` y abrilo en el teléfono (permitir "instalar de esta fuente").
            2. Para **auto-updates**: instalá [Obtainium](https://github.com/ImranR98/Obtainium) y agregá este repo
               (`https://github.com/${{ github.repository }}`) como app; te avisa de cada nuevo release.

            Actualiza sobre una instalación previa sin desinstalar (misma clave de firma).

            versionCode: ${{ steps.ver.outputs.vc }}
