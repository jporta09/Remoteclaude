# Conexión remota — variante "SSH directo al host" (sin contenedor privilegiado).
#   - tailscale: pone al HOST en tu tailnet (red que sobrevive cortes/roaming).
#   - display  : pantalla virtual + noVNC para ver el navegador headed del host.
#
# La TERMINAL ya NO usa un contenedor: la app SSH-ea al sshd del HOST como tu usuario
# (solo-clave) y corre tmux en el host. No hay nada con privilegios de root — la única
# forma de obtener root es `sudo` puntual desde la sesión, como en cualquier shell.
#
#   1. En el host:  sudo apt install openssh-server tmux
#   2. Autorizá la clave de la app en  ~/.ssh/authorized_keys  (botón 🔑 de la app)
#   3. cp .env.example .env  (completá TS_AUTHKEY)  &&  docker compose up -d
#   Desde la app:  conectá a  <usuario>@remoteclaude:22
services:
  # Red: une el HOST a la tailnet (network_mode: host => la IP de la tailnet vive en la
  # red del host, así el sshd del host y el noVNC son alcanzables por la tailnet).
  # Necesita NET_ADMIN/NET_RAW + /dev/net/tun para manejar el túnel; NO es privileged.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: remoteclaude-ts
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?falta TS_AUTHKEY (ver .env.example)}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--hostname=${TS_HOSTNAME:-remoteclaude}
    volumes:
      - ts-state:/var/lib/tailscale
    restart: unless-stopped

  # Pantalla virtual aislada para ver el navegador headed del host desde el celu.
  # El navegador corre EN EL HOST (DISPLAY=localhost:99) y dibuja en este Xvfb.
  # Sin privilegios.
  display:
    build:
      context: .
      dockerfile: Dockerfile.display
    container_name: remoteclaude-display
    environment:
      - SCREEN_GEOMETRY=${SCREEN_GEOMETRY:-1360x768x24}
    ports:
      - "6080:6080"             # noVNC -> visible por la tailnet (lo ves en el celu)
      - "127.0.0.1:6099:6099"   # Xvfb TCP -> solo el host local dibuja acá (X es inseguro)
    restart: unless-stopped

volumes:
  ts-state:
