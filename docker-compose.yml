# Gateway de conexión remota agnóstico.
#   - tailscale: pone al HOST en tu tailnet (red que sobrevive cortes/roaming).
#   - gateway  : sshd + mosh; al loguearte, la shell salta al HOST (nsenter).
# La EJECUCIÓN ocurre en el host, no en el contenedor. Nada se instala en el host.
#
#   1. cp .env.example .env   y completá TS_AUTHKEY y HOST_USER
#   2. poné tu clave pública en  ssh/authorized_keys
#   3. docker compose up -d --build
#   Desde el celular:  mosh root@remoteclaude   ->   shell del host
services:
  # Red: une el HOST a la tailnet (network_mode: host => la IP de la tailnet vive
  # en la red del host, así los servicios que levantes en el host son alcanzables).
  tailscale:
    image: tailscale/tailscale:latest
    container_name: remoteclaude-ts
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?falta TS_AUTHKEY (ver .env.example)}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--hostname=${TS_HOSTNAME:-remoteclaude}
    volumes:
      - ts-state:/var/lib/tailscale
    restart: unless-stopped

  # Gateway: provee sshd/mosh y salta al host. Privilegiado a propósito: entrar a
  # los namespaces del host (pid: host) es lo que permite ejecutar EN el host.
  gateway:
    build: .
    container_name: remoteclaude-gw
    network_mode: host        # sshd/mosh en la red del host -> alcanzable por la tailnet
    pid: host                 # ver PID 1 del host para nsenter
    privileged: true          # entrar a los namespaces del host
    environment:
      - HOST_USER=${HOST_USER:-root}   # usuario del host al que saltás
      - SSH_PORT=${SSH_PORT:-22}
      - ENROLL_PASSWORD=${ENROLL_PASSWORD:-}   # habilita auto-enrolamiento de claves
    volumes:
      - ./ssh/authorized_keys:/etc/remoteclaude/authorized_keys:ro
      - ssh-hostkeys:/etc/ssh/keys
      - gw-enrolled:/var/lib/remoteclaude   # claves enroladas en runtime (persisten)
    depends_on:
      - tailscale
    restart: unless-stopped
    command: ["sleep", "infinity"]

  # Pantalla virtual aislada para ver el navegador headed del host desde el celu.
  # El navegador corre EN EL HOST (DISPLAY=localhost:99) y dibuja en este Xvfb.
  display:
    build:
      context: .
      dockerfile: Dockerfile.display
    container_name: remoteclaude-display
    environment:
      - SCREEN_GEOMETRY=${SCREEN_GEOMETRY:-1360x768x24}
    ports:
      - "6080:6080"             # noVNC -> visible por la tailnet (lo ves en el celu)
      - "127.0.0.1:6099:6099"   # Xvfb TCP -> solo el host local dibuja acá (X es inseguro)
    restart: unless-stopped

volumes:
  ts-state:
  ssh-hostkeys:
  gw-enrolled:
